name: release
# One release per tag: the full CI matrix (Linux + macOS, Node 24 and the 22.19 floor, real pi suite, packaged
# smoke) must pass, then the exact tagged commit is STAGED on npm with provenance (a stage-only token cannot
# publish; the owner approves the staged version with 2FA on npmjs.com or `npm stage approve <id>`), and a GitHub
# Release is created from that version's CHANGELOG section.
on:
  push:
    tags: ["v*"]
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # staged publishing needs npm >= 11.15
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Stage on npm (a re-run skips a version that is already published or staged)
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          if npm stage list "$name" 2>/dev/null | grep -q "${GITHUB_REF_NAME#v}"; then echo "already staged"; exit 0; fi
          npm stage publish --provenance --access public
          echo "::notice::Staged $name@${GITHUB_REF_NAME#v}; approve it on npmjs.com (or npm stage approve <id>) to publish."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
