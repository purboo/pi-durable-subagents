name: Windows hold snapshot
on: push
permissions:
  contents: read
jobs:
  hold:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test --test-force-exit test/unit/cli/hold-windows.test.ts
