name: ci
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22.19 is the engines floor (runs .ts without flags; worker.cpuUsage and process.threadCpuUsage, which the
        # evaluator's CPU limit needs); the real-pi suite runs on 24.
        node: ["24", "22.19"]
    runs-on: ${{ matrix.os }}
    # A hung run is killed by scripts/ci-test.mjs after 25 min; this bounds everything else (default is 6 h).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:imports
      # A failing file is rerun once; a pass on the rerun is a flaky warning annotation, a second failure fails.
      # A unit test that sets no timeout of its own fails after 2 min, naming itself instead of hanging the run;
      # --test-force-exit ends a test file once its tests are done, even if a timed-out test left a timer or handle.
      - run: node scripts/ci-test.mjs unit.log --test-timeout=120000 --test-force-exit 'test/unit/**/*.test.ts'
      - run: node scripts/ci-test.mjs pi.log --test-concurrency=1 --test-force-exit 'test/pi/**/*.test.ts'
        if: matrix.node == '24'
      - run: npm run pack:smoke 2>&1 | tee pack.log; exit ${PIPESTATUS[0]}
        shell: bash
      - run: node scripts/ci-annotate.mjs unit.log pi.log pack.log
        if: failure()
